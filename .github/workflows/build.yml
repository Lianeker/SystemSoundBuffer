name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # El motor y la linea de comandos no dependen del SDK, asi que este trabajo
  # corre siempre y no puede quedarse a medias sin decirlo.
  motor:
    name: motor ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-msvc
            os: windows-latest
          - name: linux-x64-gcc
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libpulse-dev

      - name: Ninja en Windows
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Entorno MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      # El runner no tiene servidor de sonido, asi que grabar no se puede. Lo que
      # si se comprueba es que enumerar no revienta ni se cuelga sin servidor:
      # es el primer camino que toca el sistema de audio al arrancar.
      - name: Enumerar fuentes
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ./build/ssb.exe list; else ./build/ssb list; fi

  # La interfaz necesita el SDK, que hoy vive en un repositorio privado. Sin
  # acceso, este trabajo NO se ejecuta: aparece como omitido, que es informacion.
  # Compilarlo sin interfaz y darlo por verde no lo seria.
  #
  # Para activarlo: hacer publico Lianeker/nappgui-modernize, o dar un token con
  # acceso de lectura en el secreto NAPPGUI_TOKEN.
  interfaz:
    name: interfaz ${{ matrix.name }}
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-msvc
            os: windows-latest
          - name: linux-x64-gcc
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: SystemSoundBuffer

      - name: El SDK NAppGUI
        id: sdk
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Lianeker/nappgui-modernize
          ref: modernize
          path: nappgui/nappgui_src
          token: ${{ secrets.NAPPGUI_TOKEN || github.token }}

      - name: Sin acceso al SDK
        if: steps.sdk.outcome != 'success'
        run: |
          echo "No se ha podido clonar el SDK: el repositorio es privado y no hay"
          echo "secreto NAPPGUI_TOKEN. La interfaz no se compila en este trabajo."
          exit 1

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libpulse-dev \
            libgtk-3-dev libcurl4-openssl-dev libglu1-mesa-dev \
            freeglut3-dev mesa-common-dev libwebkit2gtk-4.1-dev

      - name: Ninja en Windows
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Entorno MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Sin demos ni tests del SDK: aqui solo hace falta el paquete instalado.
      - name: Compilar e instalar el SDK
        working-directory: nappgui
        run: |
          cmake -S nappgui_src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNAPPGUI_DEMO=NO -DNAPPGUI_TESTS=NO "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/nappgui/install"
          cmake --build build
          cmake --install build

      # SSB_REQUIRE_GUI: find_package(nappgui QUIET) es silencioso. Sin esto, si
      # el SDK no apareciera, el CMake omitiria la interfaz con un mensaje y el
      # trabajo pasaria en verde sin haberla compilado.
      - name: Compilar con interfaz
        working-directory: SystemSoundBuffer
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSSB_REQUIRE_GUI=ON "-DSSB_NAPPGUI_DIR=${{ github.workspace }}/nappgui/install/cmake"
          cmake --build build

      - name: Tests
        working-directory: SystemSoundBuffer
        run: ctest --test-dir build --output-on-failure
