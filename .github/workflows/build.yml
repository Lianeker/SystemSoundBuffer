name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # El motor y la linea de comandos no dependen del SDK, asi que este trabajo
  # corre siempre y no puede quedarse a medias sin decirlo.
  motor:
    name: motor ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-msvc
            os: windows-latest
          - name: linux-x64-gcc
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libpulse-dev \
            pulseaudio pulseaudio-utils

      - name: Ninja en Windows
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Entorno MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      # Sin servidor de sonido, que es como arranca un runner. Comprueba que
      # enumerar no revienta ni se cuelga: es el primer camino que toca el
      # sistema de audio, y el unico que se puede recorrer sin servidor.
      - name: Enumerar fuentes
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ./build/ssb.exe list; else ./build/ssb list; fi

      # Y con servidor propio si se puede grabar. Esto es lo unico que separa
      # "compila en Linux" de "captura en Linux"; hasta ahora la tabla del README
      # prometia lo segundo y solo se comprobaba lo primero. Ver docs/28.
      - name: Captura con audio real
        if: runner.os == 'Linux'
        run: sh probes/linux-tono.sh 10 build

      # Dos aplicaciones sonando por el mismo sink, cada una con su tono, y se
      # graba una sola. La prueba lleva su propio control: grabar el sink entero
      # tiene que FALLAR la misma comprobacion, o el verde no significaria nada.
      - name: Captura por aplicacion
        if: runner.os == 'Linux'
        run: sh probes/linux-aplicacion.sh 10 build

  # La interfaz necesita el SDK, que se clona de su repositorio.
  interfaz:
    name: interfaz ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-msvc
            os: windows-latest
          - name: linux-x64-gcc
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: SystemSoundBuffer

      - name: El SDK NAppGUI
        uses: actions/checkout@v4
        with:
          repository: Lianeker/nappgui-modernize
          ref: modernize
          path: nappgui/nappgui_src

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libpulse-dev \
            libgtk-3-dev libcurl4-openssl-dev libglu1-mesa-dev \
            freeglut3-dev mesa-common-dev libwebkit2gtk-4.1-dev \
            pulseaudio pulseaudio-utils xvfb imagemagick x11-utils

      - name: Ninja en Windows
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Entorno MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Sin demos ni tests del SDK: aqui solo hace falta el paquete instalado.
      - name: Compilar e instalar el SDK
        working-directory: nappgui
        run: |
          cmake -S nappgui_src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNAPPGUI_DEMO=NO -DNAPPGUI_TESTS=NO "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/nappgui/install"
          cmake --build build
          cmake --install build

      # SSB_REQUIRE_GUI: find_package(nappgui QUIET) es silencioso. Sin esto, si
      # el SDK no apareciera, el CMake omitiria la interfaz con un mensaje y el
      # trabajo pasaria en verde sin haberla compilado.
      - name: Compilar con interfaz
        working-directory: SystemSoundBuffer
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSSB_REQUIRE_GUI=ON "-DSSB_NAPPGUI_DIR=${{ github.workspace }}/nappgui/install/cmake"
          cmake --build build

      - name: Tests
        working-directory: SystemSoundBuffer
        run: ctest --test-dir build --output-on-failure

      # El ciclo entero sin pantalla y sin tarjeta: abrir la ventana, anadir la
      # fuente, grabar, seleccionar un tramo, exportarlo, y comprobar que el WAV
      # exportado lleva el tono que sonaba. Abrir y cerrar no prueba que grabe.
      - name: Ciclo completo de la interfaz
        if: runner.os == 'Linux'
        working-directory: SystemSoundBuffer
        run: sh probes/linux-interfaz.sh build

  # PipeWire, en su propio trabajo y no como un paso mas: `pipewire-pulse` y
  # `pulseaudio` son el mismo servicio y los paquetes se excluyen, asi que no
  # pueden convivir en una misma maquina. Aqui esta la mitad del mundo que no
  # corre PulseAudio puro. Ver docs/30.
  pipewire:
    name: motor e interfaz sobre PipeWire
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: SystemSoundBuffer

      - name: El SDK NAppGUI
        uses: actions/checkout@v4
        with:
          repository: Lianeker/nappgui-modernize
          ref: modernize
          path: nappgui/nappgui_src

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libpulse-dev \
            libgtk-3-dev libcurl4-openssl-dev libglu1-mesa-dev \
            freeglut3-dev mesa-common-dev libwebkit2gtk-4.1-dev \
            pipewire pipewire-pulse wireplumber pulseaudio-utils xvfb dbus \
            imagemagick x11-utils

      - name: Que servidor hay
        run: |
          echo "pulseaudio: $(command -v pulseaudio || echo ---)"
          echo "pipewire:   $(command -v pipewire || echo ---)"
          pipewire --version || true
          systemctl --version | head -1 || true

      - name: Compilar e instalar el SDK
        working-directory: nappgui
        run: |
          cmake -S nappgui_src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNAPPGUI_DEMO=NO -DNAPPGUI_TESTS=NO "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/nappgui/install"
          cmake --build build
          cmake --install build

      - name: Compilar con interfaz
        working-directory: SystemSoundBuffer
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSSB_REQUIRE_GUI=ON "-DSSB_NAPPGUI_DIR=${{ github.workspace }}/nappgui/install/cmake"
          cmake --build build

      - name: Captura con audio real
        working-directory: SystemSoundBuffer
        env:
          SSB_SERVER: pipewire
        run: sh probes/linux-tono.sh 10 build

      - name: Captura por aplicacion
        working-directory: SystemSoundBuffer
        env:
          SSB_SERVER: pipewire
        run: sh probes/linux-aplicacion.sh 10 build

      - name: Ciclo completo de la interfaz
        working-directory: SystemSoundBuffer
        env:
          SSB_SERVER: pipewire
        run: sh probes/linux-interfaz.sh build
